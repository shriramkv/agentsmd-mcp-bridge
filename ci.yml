name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check agentsmd_mcp_bridge tests
      - name: Test
        run: pytest --cov=agentsmd_mcp_bridge --cov-report=term-missing

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Generate MCP server from our own AGENTS.md
        run: |
          python -m agentsmd_mcp_bridge.cli generate-mcp AGENTS.md -o /tmp/mcp_server.py -s agentsmd-bridge
      - name: Assert generated server is valid Python
        run: python -c "import ast; ast.parse(open('/tmp/mcp_server.py').read()); print('generated server is valid')"
